<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>RAZANA </title>
<style>
  body { margin: 0; background: #0a0a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const W = 480, H = 560;
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');

let t = 0;

function bone(x1, y1, x2, y2, r1, r2, color) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx*dx + dy*dy);
  const nx = -dy/len, ny = dx/len;

  ctx.beginPath();
  ctx.moveTo(x1 + nx*r1, y1 + ny*r1);
  ctx.bezierCurveTo(
    x1 + nx*r1 + dx*0.3, y1 + ny*r1 + dy*0.3,
    x2 + nx*r2 + dx*(-0.3), y2 + ny*r2 + dy*(-0.3),
    x2 + nx*r2, y2 + ny*r2
  );
  ctx.lineTo(x2 - nx*r2, y2 - ny*r2);
  ctx.bezierCurveTo(
    x2 - nx*r2 + dx*(-0.3), y2 - ny*r2 + dy*(-0.3),
    x1 - nx*r1 + dx*0.3, y1 - ny*r1 + dy*0.3,
    x1 - nx*r1, y1 - ny*r1
  );
  ctx.closePath();

  const grad = ctx.createLinearGradient(x1, y1, x2, y2);
  grad.addColorStop(0, color);
  grad.addColorStop(0.5, '#ffffff');
  grad.addColorStop(1, color);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.strokeStyle = 'rgba(0,200,255,0.4)';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x1, y1, r1, 0, Math.PI*2);
  const g1 = ctx.createRadialGradient(x1-r1*0.3, y1-r1*0.3, 0, x1, y1, r1);
  g1.addColorStop(0, '#ffffff');
  g1.addColorStop(1, color);
  ctx.fillStyle = g1;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x2, y2, r2, 0, Math.PI*2);
  const g2 = ctx.createRadialGradient(x2-r2*0.3, y2-r2*0.3, 0, x2, y2, r2);
  g2.addColorStop(0, '#ffffff');
  g2.addColorStop(1, color);
  ctx.fillStyle = g2;
  ctx.fill();
}

function skull(cx, cy, scale) {
  ctx.save();
  ctx.translate(cx, cy);

  const glow = ctx.createRadialGradient(0, -5*scale, 2, 0, -5*scale, 28*scale);
  glow.addColorStop(0, 'rgba(0,255,255,0.15)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(0, -5*scale, 28*scale, 0, Math.PI*2);
  ctx.fillStyle = glow;
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(0, -8*scale, 18*scale, 20*scale, 0, 0, Math.PI*2);
  const cg = ctx.createRadialGradient(-5*scale, -15*scale, 1, 0, -8*scale, 20*scale);
  cg.addColorStop(0, '#ffffff');
  cg.addColorStop(0.6, '#c8e8f0');
  cg.addColorStop(1, '#7ab8cc');
  ctx.fillStyle = cg;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,200,255,0.5)';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(0, 12*scale, 12*scale, 8*scale, 0, 0, Math.PI*2);
  ctx.fillStyle = '#c8e8f0';
  ctx.fill();
  ctx.stroke();

  [-7, 7].forEach(ox => {
    ctx.beginPath();
    ctx.ellipse(ox*scale, -8*scale, 5*scale, 4*scale, 0, 0, Math.PI*2);
    ctx.fillStyle = '#0a0a1a';
    ctx.fill();

    const eg = ctx.createRadialGradient(ox*scale, -8*scale, 0, ox*scale, -8*scale, 5*scale);
    eg.addColorStop(0, 'rgba(0,255,200,0.9)');
    eg.addColorStop(0.5, 'rgba(0,150,255,0.4)');
    eg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.ellipse(ox*scale, -8*scale, 5*scale, 4*scale, 0, 0, Math.PI*2);
    ctx.fillStyle = eg;
    ctx.fill();
  });

  ctx.beginPath();
  ctx.moveTo(0, -2*scale);
  ctx.lineTo(-2*scale, 3*scale);
  ctx.lineTo(2*scale, 3*scale);
  ctx.fillStyle = '#0a0a1a';
  ctx.fill();

  for(let i=-3; i<=3; i++) {
    ctx.beginPath();
    ctx.rect(i*3*scale - 1*scale, 8*scale, 2*scale, 3*scale);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }

  ctx.restore();
}

function drawRazana(cx, cy) {
  const pulse = 0.7 + 0.3 * Math.sin(t * 0.08);
  const glowSize = 18 + 4 * Math.sin(t * 0.08);

  const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowSize * 4);
  halo.addColorStop(0, `rgba(0,255,200,${0.25 * pulse})`);
  halo.addColorStop(0.5, `rgba(0,150,255,${0.12 * pulse})`);
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.ellipse(cx, cy, glowSize * 4, glowSize * 1.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = halo;
  ctx.fill();

  ctx.save();
  ctx.shadowColor = `rgba(0,255,200,${0.9 * pulse})`;
  ctx.shadowBlur = 18;
  ctx.font = 'bold 26px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const letters = 'RAZANA';
  const totalW = letters.length * 17;
  const startX = cx - totalW / 2 + 8;

  letters.split('').forEach((ch, i) => {
    const hue = (200 + i * 15 + t * 0.5) % 360;
    ctx.fillStyle = `hsl(${hue}, 100%, ${70 + 15 * Math.sin(t*0.1 + i)}%)`;
    ctx.fillText(ch, startX + i * 17, cy);
  });

  ctx.restore();

  const lineAlpha = 0.4 + 0.2 * Math.sin(t * 0.08);
  ctx.beginPath();
  ctx.moveTo(cx - 55, cy + 14);
  ctx.lineTo(cx + 55, cy + 14);
  ctx.strokeStyle = `rgba(0,220,255,${lineAlpha})`;
  ctx.lineWidth = 1;
  ctx.stroke();

  [cx - 55, cx + 55].forEach(dx => {
    ctx.beginPath();
    ctx.moveTo(dx, cy + 14 - 4);
    ctx.lineTo(dx + 4, cy + 14);
    ctx.lineTo(dx, cy + 14 + 4);
    ctx.lineTo(dx - 4, cy + 14);
    ctx.closePath();
    ctx.fillStyle = `rgba(0,220,255,${lineAlpha})`;
    ctx.fill();
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  for(let i=0; i<40; i++) {
    const px = (i*67+t*0.2) % W;
    const py = (i*43+t*0.15) % H;
    const a = 0.3 + 0.3*Math.sin(t*0.05+i);
    ctx.beginPath();
    ctx.arc(px, py, 1, 0, Math.PI*2);
    ctx.fillStyle = `rgba(0,200,255,${a})`;
    ctx.fill();
  }

  const cx = W/2;
  const cy = H/2;

  const sway      = Math.sin(t * 0.04) * 8;
  const bob       = Math.sin(t * 0.07) * 5;
  const breathe   = Math.sin(t * 0.05) * 2;
  const armAngle  = Math.sin(t * 0.06) * 0.4;
  const legAngle  = Math.sin(t * 0.06) * 0.3;

  const boneColor = '#a8d8e8';

  const spineX   = cx + sway*0.5;
  const spineTop = cy - 60 + bob;
  const spineBot = cy + 70 + bob;

  // Colonne vertébrale
  for(let i=0; i<7; i++) {
    const y  = spineTop + i*(spineBot-spineTop)/6;
    const yn = spineTop + (i+1)*(spineBot-spineTop)/6;
    bone(spineX, y, spineX, yn, 5+breathe, 5+breathe, boneColor);
  }

  // Bassin
  ctx.beginPath();
  ctx.ellipse(spineX, spineBot, 32, 14, 0, 0, Math.PI*2);
  const pg = ctx.createRadialGradient(spineX-8, spineBot-5, 1, spineX, spineBot, 32);
  pg.addColorStop(0, '#ffffff');
  pg.addColorStop(0.6, '#a8d8e8');
  pg.addColorStop(1, '#5a9ab0');
  ctx.fillStyle = pg;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,200,255,0.4)';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // Côtes
  const chestX = spineX;
  const chestY = cy - 20 + bob;

  for(let i=0; i<5; i++) {
    const ry     = chestY + i*14;
    const spread = 22 + i*2 + breathe;

    ctx.beginPath();
    ctx.moveTo(chestX, ry);
    ctx.bezierCurveTo(chestX - spread*0.5, ry - 5, chestX - spread, ry + 5, chestX - spread, ry + 10);
    ctx.strokeStyle = '#a8d8e8';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(chestX, ry);
    ctx.bezierCurveTo(chestX + spread*0.5, ry - 5, chestX + spread, ry + 5, chestX + spread, ry + 10);
    ctx.stroke();
  }

  // Sternum
  bone(chestX, chestY, chestX, chestY + 60 + breathe, 5, 4, boneColor);

  // Clavicules
  const shoulderY    = cy - 55 + bob;
  const shoulderSpan = 55;
  bone(spineX, shoulderY, spineX - shoulderSpan, shoulderY + 5, 5, 6, boneColor);
  bone(spineX, shoulderY, spineX + shoulderSpan, shoulderY + 5, 5, 6, boneColor);

  // Bras gauche
  const lShX = spineX - shoulderSpan;
  const lShY = shoulderY + 5;
  const lElX = lShX - 20 - Math.sin(armAngle)*30;
  const lElY = lShY + 70;
  const lHaX = lElX - 5 - Math.sin(armAngle*1.5)*20;
  const lHaY = lElY + 55;

  bone(lShX, lShY, lElX, lElY, 7, 6, boneColor);
  bone(lElX, lElY, lHaX, lHaY, 5, 4, boneColor);
  bone(lHaX, lHaY, lHaX - 5, lHaY + 15, 4, 2, boneColor);
  bone(lHaX, lHaY, lHaX + 3, lHaY + 16, 3, 2, boneColor);
  bone(lHaX, lHaY, lHaX + 8, lHaY + 14, 3, 2, boneColor);

  // Bras droit
  const rShX = spineX + shoulderSpan;
  const rShY = shoulderY + 5;
  const rElX = rShX + 20 + Math.sin(armAngle)*30;
  const rElY = rShY + 70;
  const rHaX = rElX + 5 + Math.sin(armAngle*1.5)*20;
  const rHaY = rElY + 55;

  bone(rShX, rShY, rElX, rElY, 7, 6, boneColor);
  bone(rElX, rElY, rHaX, rHaY, 5, 4, boneColor);
  bone(rHaX, rHaY, rHaX + 5, rHaY + 15, 4, 2, boneColor);
  bone(rHaX, rHaY, rHaX - 3, rHaY + 16, 3, 2, boneColor);
  bone(rHaX, rHaY, rHaX - 8, rHaY + 14, 3, 2, boneColor);

  // Jambes
  const hipY = spineBot + 5 + bob;

  const lKnX = spineX - 18 + Math.sin(legAngle)*15;
  const lKnY = hipY + 80;
  const lFtX = lKnX - 5 + Math.sin(legAngle*1.2)*10;
  const lFtY = lKnY + 80;

  bone(spineX - 18, hipY, lKnX, lKnY, 9, 8, boneColor);
  bone(lKnX, lKnY, lFtX, lFtY, 7, 5, boneColor);
  bone(lFtX, lFtY, lFtX - 15, lFtY + 5, 5, 3, boneColor);

  const rKnX = spineX + 18 - Math.sin(legAngle)*15;
  const rKnY = hipY + 80;
  const rFtX = rKnX + 5 - Math.sin(legAngle*1.2)*10;
  const rFtY = rKnY + 80;

  bone(spineX + 18, hipY, rKnX, rKnY, 9, 8, boneColor);
  bone(rKnX, rKnY, rFtX, rFtY, 7, 5, boneColor);
  bone(rFtX, rFtY, rFtX + 15, rFtY + 5, 5, 3, boneColor);

  // Crâne
  const skullCX = spineX + sway*0.3;
  const skullCY = cy - 95 + bob;
  skull(skullCX, skullCY, 1);

  // Texte RAZANA
  drawRazana(skullCX, skullCY - 40);

  // Ombre au sol
  const shadowAlpha = 0.15 + 0.05*Math.sin(t*0.07);
  ctx.beginPath();
  ctx.ellipse(cx + sway*0.2, 530, 50, 8, 0, 0, Math.PI*2);
  ctx.fillStyle = `rgba(0,200,255,${shadowAlpha})`;
  ctx.fill();

  t++;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
